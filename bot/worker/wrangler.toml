# Конфигурация Cloudflare Worker для интерактивного Telegram-бота.
# После создания KV-хранилища подставьте его id ниже (поле id у kv_namespaces).

name = "tasktracker-bot"
main = "worker.js"
compatibility_date = "2024-09-01"

# Проверка уведомлений раз в минуту
[triggers]
crons = ["* * * * *"]

# Хранилище состояния (сессии диалога + статусы уведомлений).
# id получите командой: npx wrangler kv namespace create BOT_KV
[[kv_namespaces]]
binding = "BOT_KV"
id = "ЗАМЕНИТЬ_НА_ID_KV"

# Открытые настройки (не секреты). Значения ниже — под вашу установку.
[vars]
DATA_OWNER = "borinsobaka-lab"
DATA_REPO = "task-tracker-data"
DATA_BRANCH = "tasks-data"
AUTH_OWNER = "borinsobaka-lab"
AUTH_REPO = "task-tracker"
AUTH_BRANCH = "app-config"
TZ_NAME = "Asia/Tbilisi"
APP_URL = "https://borinsobaka-lab.github.io/task-tracker/"

# Секреты НЕ храните в этом файле. Задайте их отдельно (см. README):
#   TELEGRAM_BOT_TOKEN — токен бота от @BotFather
#   DATA_TOKEN         — GitHub-токен с доступом на чтение приватного репо данных
#   WEBHOOK_SECRET     — любая длинная строка (защита вебхука)
