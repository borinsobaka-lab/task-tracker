name: Android APK

# Собирает APK (оболочка + виджет) и публикует его в релиз android-latest,
# чтобы можно было скачать и установить на телефон.

on:
  workflow_dispatch:
  push:
    branches: [claude/task-tracker-service-lpv708, main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk task-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-tracker-apk
          path: task-tracker.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Удаляем ВСЕ прошлые релизы с этим тегом, включая «черновики»
          # (untagged), которые иногда оставались после гонки delete+create.
          gh api "repos/$REPO/releases" --paginate \
            | jq -r '.[] | select(.tag_name=="android-latest") | .id' \
            | while read -r id; do gh api -X DELETE "repos/$REPO/releases/$id" || true; done
          git push origin :refs/tags/android-latest 2>/dev/null || true
          # Явно создаём тег на текущем коммите и пушим ДО создания релиза —
          # иначе из-за незавершённого удаления тега релиз создаётся как черновик.
          git tag -f android-latest
          git push -f origin refs/tags/android-latest
          # Публикуем релиз (--verify-tag: тег уже есть, новый не создаём) + APK
          gh release create android-latest task-tracker.apk \
            --title "Android APK (последняя сборка)" \
            --notes "Debug-сборка приложения-оболочки с виджетом «Таймлайн». Скачайте task-tracker.apk на телефон и установите (разрешите установку из этого источника)." \
            --prerelease --verify-tag
