name: Telegram-бот отчётов

on:
  schedule:
    # Время — Тбилиси (UTC+4). GitHub cron задаётся в UTC.
    - cron: '0 6 * * *'        # 10:00 Тбилиси — утренний список задач
    - cron: '0 16 * * *'       # 20:00 Тбилиси — вечерний итог + задачи на завтра
    - cron: '*/15 6-16 * * *'  # днём каждые 15 мин — обновление статусов в утреннем сообщении
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что отправить'
        type: choice
        default: morning
        options: [morning, evening, refresh]

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправить/обновить отчёт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          STATE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TZ_NAME: Asia/Tbilisi
          APP_URL: https://borinsobaka-lab.github.io/task-tracker/
          MODE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.mode
                || github.event.schedule == '0 6 * * *' && 'morning'
                || github.event.schedule == '0 16 * * *' && 'evening'
                || 'refresh' }}
        run: node bot/report.mjs
