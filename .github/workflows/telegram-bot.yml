name: Telegram-бот отчётов

on:
  schedule:
    - cron: '0 7 * * *'        # 10:00 МСК — утренний список задач
    - cron: '0 17 * * *'       # 20:00 МСК — вечерний итог + задачи на завтра
    - cron: '*/15 7-18 * * *'  # днём каждые 15 мин — обновление статусов в утреннем сообщении
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что отправить'
        type: choice
        default: morning
        options: [morning, evening, refresh]

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Отправить/обновить отчёт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          STATE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.mode
                || github.event.schedule == '0 7 * * *' && 'morning'
                || github.event.schedule == '0 17 * * *' && 'evening'
                || 'refresh' }}
        run: node bot/report.mjs
