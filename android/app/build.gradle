plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borinsobaka.tasktracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.borinsobaka.tasktracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Фиксированный ключ подписи (не секрет — обычный debug-ключ), чтобы новые
    // сборки устанавливались поверх старых без удаления приложения.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Только фреймворк Android (WebView, App Widget, org.json) — сторонних зависимостей нет.
}
