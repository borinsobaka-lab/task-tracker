plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borinsobaka.tasktracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.borinsobaka.tasktracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Только фреймворк Android (WebView, App Widget, org.json) — сторонних зависимостей нет.
}
